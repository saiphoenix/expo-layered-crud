name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      # Known, accepted warning on SDK 56: Hermes V1 memory regression (fixed in SDK 57).
      # See README -> "Known issues". Reported here, but does not fail the build.
      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true
